services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend
    command:
      - osrm-routed
      - --algorithm
      - mld
      - /data/hcm_2026.osrm
    volumes:
      - ./:/data:ro
    ports:
      - "5001:5000"
    restart: unless-stopped

  python-app:
    build:
      context: ./tsp_osrm_demo
      dockerfile: Dockerfile
    environment:
      OSRM_BASE_URL: "http://osrm:5000"
      OSRM_PROFILE: "driving"
    volumes:
      - ./tsp_osrm_demo/output:/app/output
    depends_on:
      - osrm
    restart: "no"
